schema_version = "1.0.0"
id = "fumaris_liquid"
version = "0.3.36-beta.1"
name = "Aquaris Beta"
tagline = "Interactive GPU liquid simulation (FLIP) with live preview"
maintainer = "Fumaris"
type = "add-on"
blender_version_min = "5.2.0"
license = ["SPDX:GPL-3.0-or-later"]
platforms = ["linux-x64", "windows-x64", "macos-arm64"]
tags = ["Physics", "Animation"]

[permissions]
files = "Write liquid and shader caches; run the bundled native solver"
clipboard = "Copy diagnostics for support"

[build]
paths_exclude_pattern = ["__pycache__/", ".*", "*.pyc", "*.zip"]
